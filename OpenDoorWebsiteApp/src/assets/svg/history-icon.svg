<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="historyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E6" />
      <stop offset="50%" style="stop-color:#E5DECF" />
      <stop offset="100%" style="stop-color:#5F7A61" />
    </linearGradient>
  </defs>
  
  <!-- Scroll background -->
  <rect x="8" y="12" width="48" height="40" fill="url(#historyGradient)" rx="4"/>
  
  <!-- Scroll ends -->
  <circle cx="8" cy="32" r="6" fill="#E5DECF"/>
  <circle cx="56" cy="32" r="6" fill="#E5DECF"/>
  
  <!-- Text lines representing history -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#1C1917" stroke-width="2"/>
  <line x1="16" y1="26" x2="44" y2="26" stroke="#1C1917" stroke-width="2"/>
  <line x1="16" y1="32" x2="46" y2="32" stroke="#1C1917" stroke-width="2"/>
  <line x1="16" y1="38" x2="42" y2="38" stroke="#1C1917" stroke-width="2"/>
  <line x1="16" y1="44" x2="40" y2="44" stroke="#1C1917" stroke-width="2"/>
  
  <!-- Historical date -->
  <text x="32" y="58" fill="#5F7A61" font-size="8" font-weight="bold" text-anchor="middle">Est. 1975</text>
  
  <!-- Decorative quill -->
  <path d="M 50 8 Q 54 4 58 8 Q 54 12 50 16 L 46 20 L 42 16 Z" fill="#5F7A61"/>
  <line x1="46" y1="20" x2="40" y2="26" stroke="#E5DECF" stroke-width="1"/>
