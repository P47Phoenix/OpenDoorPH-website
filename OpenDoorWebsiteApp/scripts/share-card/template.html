<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700&display=block">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; background: #F5F0E6; color: #1C1917; overflow: hidden; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; border-bottom: 12px solid #9A4A2E; }
  .name { font-family: Lora, Georgia, serif; font-weight: 700; font-size: 72px; line-height: 1.1; margin: 0 0 16px; }
  .place { font-family: Inter, system-ui, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: .08em; text-transform: uppercase; color: #5F7A61; margin: 0 0 40px; }
  .verse { font-family: Lora, Georgia, serif; font-style: italic; font-weight: 400; font-size: 40px; line-height: 1.3; margin: 0 0 40px; max-width: 1008px; }
  .time { font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 36px; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <p class="name">Open Door Full Gospel Church</p>
    <p class="place">Pleasant Hill, Missouri</p>
    <p class="verse">"Restore such a one in a spirit of gentleness." Galatians 6:1</p>
    <p class="time">Sundays 10:30 AM</p>
  </div>
</body>
</html>
